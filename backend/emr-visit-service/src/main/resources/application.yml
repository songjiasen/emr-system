server:
  port: 8103

spring:
  application:
    name: emr-visit-service
  datasource:
    url: ${EMR_VISIT_DB_URL:jdbc:mysql://localhost:3306/emr_visit?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${EMR_VISIT_DB_USERNAME:root}
    password: ${EMR_VISIT_DB_PASSWORD:root}
    driver-class-name: ${EMR_VISIT_DB_DRIVER:com.mysql.cj.jdbc.Driver}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
